# Rotates Asterisk logs when mounted at /var/log/asterisk (Docker volume or bind).
/var/log/asterisk/messages {
    size 100M
    rotate 3
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

/var/log/asterisk/full {
    size 50M
    rotate 2
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
